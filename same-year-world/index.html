/* Year-wide comparison mode: retain the V0.6 visual language and timeline above. */
.inspection[hidden],.overview[hidden]{display:none!important}
.return-all{align-self:flex-start;text-align:left;font-size:11px;font-weight:650;color:#2a6b92;margin:0 0 8px;padding:4px 0}.return-all:hover{text-decoration:underline}
.overview{margin:4px 19px 0;padding:25px 24px 29px;border:1px solid #e3e9ed;border-radius:17px 17px 0 0;background:#fff;box-shadow:0 0 17px #203b5312}
.overview-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:0 0 18px;border-bottom:1px solid #e7ebee}
.overview-eyebrow{font:600 10px Georgia,serif;letter-spacing:2px;color:#4383a5}
.overview-heading h2{font-family:'Noto Serif SC','Songti SC',serif;letter-spacing:.3px;margin:5px 0 5px;font-size:24px;color:#193246}
.overview-heading p{font-size:12px;color:#718291;line-height:1.65;margin:0}
.overview-summary{flex-shrink:0;border-radius:25px;padding:8px 13px;background:#e8f0f4;font-size:11px;color:#385c73;font-weight:700}
.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.overview-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-align:left;padding:0;border:1px solid #e6ebef;background:#fcfdfd;border-radius:14px;box-shadow:0 2px 10px #1b39500a;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.overview-card:hover{transform:translateY(-3px);border-color:#9bb7c9;box-shadow:0 7px 24px #17365118}
.overview-card-art{display:block;height:53px;width:100%;background-size:cover;background-position:center;border-top:3px solid var(--card-color)}
.overview-card-heading{display:flex;align-items:center;gap:9px;padding:10px 13px 7px;min-height:60px;width:100%}
.overview-card-heading img{width:37px;height:37px;border-radius:50%;object-fit:cover;border:1px solid #e3e8ee}
.overview-card-identity{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.overview-card-identity strong{font-family:'Noto Serif SC',serif;font-size:16px;color:#17334b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overview-card-identity small{font:10px Georgia,serif;color:#84919e}
.overview-open{font-size:19px;color:#6c96ae;align-self:start}
.overview-card-focus{display:flex;flex-direction:column;gap:6px;margin:0 13px 5px;border-radius:9px;background:#f0f5f7;padding:11px 12px;border-left:3px solid var(--card-color);min-height:85px}
.overview-card-focus small{font-size:10px;font-weight:700;color:#6b8090}
.overview-card-focus strong{font-size:13px;font-weight:700;line-height:1.55;color:#25445a}
.overview-card-facts{display:flex;flex-direction:column;gap:0;padding:0 13px 6px;flex:1;width:100%}
.overview-card-facts>span{display:grid;grid-template-columns:57px minmax(0,1fr);gap:7px;padding:7px 1px;border-bottom:1px solid #eef1f3;align-items:start}
.overview-card-facts b{font-size:10px;font-weight:650;color:#81909b;line-height:1.5}
.overview-card-facts em{font-style:normal;font-size:11px;line-height:1.55;color:#3e5363}
.overview-card-cta{display:flex;justify-content:space-between;width:100%;padding:10px 13px;color:#376985;font-size:10px;font-weight:700}
.overview-note{margin-top:15px;font-size:10px;color:#8a99a5;line-height:1.65}
@media(max-width:1220px){.overview-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-heading{align-items:flex-start;flex-direction:column;gap:10px}.overview{margin:4px 10px 0;padding:17px}}
@media(max-width:550px){.overview-grid{grid-template-columns:1fr;gap:10px}.overview-card-art{height:65px}.overview-heading h2{font-size:21px}.overview-card-focus{min-height:unset}.overview{padding:16px 12px}}

/* V0.8 six-axis scores: original V0.7 radar remains the central comparison */
.score-flag{text-align:center;font-size:10px;color:#9a7479;line-height:1.5;margin-top:-7px}
.radar-legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
.radar-legend-item{border:1px solid #e3eaf0;background:#fbfdfe;border-radius:16px;color:#5c7787;font-size:10px;padding:4px 7px}
.radar-legend-item span{color:var(--legend)}
.radar-legend-item b{color:#254d69;font-size:11px;margin-left:3px}
.score-dim-picker{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.score-dim{border:1px solid #dce7ec;background:#f1f6f8;color:#536e80;padding:5px 8px;border-radius:18px;font-size:10px}
.score-dim.is-active{color:#fff;background:#2e617f;border-color:#2e617f;font-weight:800}
.score-detail{background:#f7fafc;border:1px solid #e0e8ed;border-radius:9px;padding:8px 10px;margin-top:9px;max-height:265px;overflow:auto}
.score-detail summary{cursor:pointer;font-size:11px;font-weight:800;color:#315b73}
.score-subs{display:grid;gap:4px;margin:8px 0}
.score-sub{display:flex;justify-content:space-between;font-size:11px;color:#586d7d;background:#fff;padding:5px 8px;border-radius:5px}
.score-sub b{color:#245d7e}
.score-detail p{font-size:10px;line-height:1.65;color:#607687;margin:6px 0}
.score-detail .score-caution{color:#9b6267}
.score-detail a{font-size:10px;color:#327796;text-decoration:underline}
.scoring-board{background:#f6fafc;border:1px solid #dce7ee;border-radius:12px;margin:15px 0;padding:12px 15px}
.scoreboard-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#315a73}
.scoreboard-head span{color:#9b7377;font-size:10px}
.score-bar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}
.score-bar-row{display:grid;grid-template-columns:55px 1fr 31px;align-items:center;gap:9px;text-align:left;border:1px solid #e9f0f3;background:#fff;border-radius:8px;padding:8px 9px;font-size:11px;min-width:0}
.score-bar-row b{color:#496b7e}
.score-bar-row strong{text-align:right;color:#284e67}
.score-bar{height:7px;background:#ebf1f4;border-radius:12px;overflow:hidden}
.score-bar i{display:block;height:100%;border-radius:12px;background:var(--chart-color)}

 <div class="inspection-chart"><h3>多维对照 <small>六维 · 研究性试评分</small></h3><div id="radar"></div><div id="radar-legend" class="radar-legend"></div><div id="score-breakdown"></div></div>
 <div class="inspection-life"><h3>当时的生活</h3><div class="life-select">${lifeTypes.map((l, i) => `<button data-life="${l}" class="${i === 0 ? 'is-active' : ''}">${l}</button>`).join('')}</div><img id="life-image" src="${asset('workers.webp')}" alt="历史劳动场景插画"/><p id="life-body"></p><button id="life-more">了解更多当时的社会生活 →</button></div>
 </section>
 <section class="overview" id="overview" aria-label="同年全球地区对照" aria-live="polite"><div class="overview-heading"><div><span class="overview-eyebrow">ONE YEAR · MANY WORLDS</span><h2><span id="overview-year">1776</span> 年 · 七地文明同期对照</h2><p>看同一时代各地在技术、生产、制度、人文与日常生活上的不同路径；选择上方文明轨道可深入了解。</p></div><span class="overview-summary" id="overview-focus"></span></div><div id="scoring-board" class="scoring-board" aria-live="polite"></div><div class="overview-grid" id="overview-grid"></div><div class="overview-note">注：当前轨道同时包含国家与大区域，资料为定性研究演示，不能用于文明高低排名。后续将逐步细化为具体历史政权。</div></section>
 <footer class="footnote"><span>同年异世 · 世界文明同期对照实验</span><span>历史资料为研究演示稿 · 关键史实需逐条核验 · <a href="https://www.worldhistory.org/" target="_blank" rel="noopener">参考资料</a></span></footer>
</main>
<div class="modal" id="dialog" aria-hidden="true"><div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button class="close" id="close-dialog" aria-label="关闭">×</button><div class="dialog-mark">ONE YEAR · MANY WORLDS</div><h2 id="dialog-title"></h2><p id="dialog-body"></p><p class="dialog-note">此版本的场景、描述和比较模型用于设计与教学演示，不应替代经过核验的历史研究。</p><div class="sources">${REFERENCE_LINKS.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${safe(link.label)} ↗</a>`).join('')}</div></div></div>
`;

let focusedRadarAxis='industry';
function renderRadar(){
 const shown=currentRegion?[currentRegion,...['europe','china','japan'].filter(id=>id!==currentRegion)].slice(0,3):['europe','china','japan'];
 const center=114,max=89;
 const point=(index=0,ratio=1)=>{const angle=-Math.PI/2+index*Math.PI/3;return `${(center+ratio*max*Math.cos(angle)).toFixed(1)},${(center+ratio*max*Math.sin(angle)).toFixed(1)}`;};
 const polygons=[.2,.4,.6,.8,1].map(scale=>`<polygon points="${SCORING_AXES.map((axis,i)=>point(i,scale)).join(' ')}" fill="none" stroke="#dce3e8" stroke-width="1"/>`).join('');
 const spokes=SCORING_AXES.map((axis,i)=>`<line x1="${center}" y1="${center}" x2="${point(i).split(',')[0]}" y2="${point(i).split(',')[1]}" stroke="#dce3e8"/>`).join('');
 const names=SCORING_AXES.map((axis,i)=>{const angle=-Math.PI/2+i*Math.PI/3;return `<text x="${(center+(max+22)*Math.cos(angle)).toFixed(1)}" y="${(center+(max+19)*Math.sin(angle)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="${axis.id===focusedRadarAxis?'#aa535b':'#748694'}" font-weight="${axis.id===focusedRadarAxis?'800':'500'}">${safe(axis.label)}</text>`;}).join('');
 const overlays=shown.map(id=>{const r=region(id),scores=scoreFor(year,id);if(!scores)return '';return `<polygon points="${scores.map((item,i)=>point(i,item.value/100)).join(' ')}" fill="${r.color}" fill-opacity=".09" stroke="${r.color}" stroke-width="${id===currentRegion?2.8:1.8}" stroke-linejoin="round"><title>${safe(r.name+' '+year+'年：'+scores.map(x=>x.axis.label+x.value+'分').join('，'))}</title></polygon>`;}).join('');
 return `<svg viewBox="-20 -25 270 275" role="img" aria-label="${year}年六维研究性试评分雷达图：${shown.map(id=>region(id).name).join('、')}">${polygons}${spokes}${overlays}${names}</svg><div class="score-flag">研究性试评分 · 未逐条史料核验</div>`;
}
function renderRadarLegend(){
 const shown=currentRegion?[currentRegion,...['europe','china','japan'].filter(id=>id!==currentRegion)].slice(0,3):['europe','china','japan'];
 const i=SCORING_AXES.findIndex(a=>a.id===focusedRadarAxis);
 return shown.map(id=>{const r=region(id),scores=scoreFor(year,id);return `<button type="button" data-region-select="${id}" class="radar-legend-item" style="--legend:${r.color}"><span>●</span>${safe(r.name)} <b>${scores?scores[i].value:'N/A'}</b></button>`;}).join('');
}
function renderScoreBreakdown(){
 if(!currentRegion)return '';
 const all=scoreFor(year,currentRegion);if(!all)return '';
 const item=all.find(s=>s.axis.id===focusedRadarAxis)||all[0];
 const f=facts(year,currentRegion);
 const context=({technology:f.technology,industry:f.industry,governance:f.governance,trade:f.industry+'；'+f.daily,culture:f.culture,military:'军事类详细史料尚未绑定，本项只是候选研究评分。'})[item.axis.id];
 const options=all.map(d=>`<button type="button" data-score-axis="${d.axis.id}" class="score-dim ${d.axis.id===focusedRadarAxis?'is-active':''}" aria-pressed="${d.axis.id===focusedRadarAxis}">${safe(d.axis.label)} ${d.value}</button>`).join('');
 const subs=item.axis.parts.map((label,i)=>`<div class="score-sub"><span>${safe(label)}</span><b>${item.parts[i]}/5</b></div>`).join('');
 return `<div class="score-dim-picker">${options}</div><details class="score-detail" open><summary>${safe(item.axis.label)} · ${item.value}/100 · 评分依据</summary><div class="score-subs">${subs}</div><p>规则：三个子指标等权，分数 = 子指标之和 ÷ 15 × 100（取整）。</p><p>历史描述：${safe(context)}</p><p class="score-caution">这些 0–5 级是人工研究性试编码，尚未逐条关联可核验史料，不能当作权威统计评分。分数仅建议用于同一年比较。</p><a target="_blank" rel="noopener noreferrer" href="https://seshat-db.com/codebook">评分指标设计参考：Seshat Codebook ↗</a></details>`;
}
function renderOverviewScoreboard(){
 const focus=SCORING_AXES.find(s=>s.id===focusedRadarAxis)||SCORING_AXES[1];
 const pos=SCORING_AXES.findIndex(s=>s.id===focus.id);
 const pills=SCORING_AXES.map(d=>`<button type="button" data-score-axis="${d.id}" class="score-dim ${d.id===focusedRadarAxis?'is-active':''}" aria-pressed="${d.id===focusedRadarAxis}">${safe(d.label)}</button>`).join('');
 const rows=REGIONS.map(r=>{const v=scoreFor(year,r.id)?.[pos]?.value;return `<button type="button" class="score-bar-row" data-region-select="${r.id}" style="--chart-color:${r.color}"><b>${safe(r.name)}</b><span class="score-bar"><i style="width:${v??0}%"></i></span><strong>${v??'N/A'}</strong></button>`;}).join('');
 return `<div class="scoreboard-head"><b>${year}年 · 六维差异评分</b><span>研究性试评分 · 同年对照</span></div><div class="score-dim-picker">${pills}</div><div class="score-bar-grid">${rows}</div><p class="score-qualifier">每个维度包含3个子指标（0–5分），等权换算为100分。分数目前是可修订的研究试编码，非已验证的权威历史指标；点击地区查看六维雷达及明细。</p>`;
}
function updateYear(y) {
    year = y;
    const epoch = EPOCHS[year];
    document.getElementById('hero-year').textContent = String(year);
    document.getElementById('hero-title').textContent = epoch.headline;
    document.getElementById('hero-intro').textContent = epoch.description;
    document.querySelectorAll('.hero-scene').forEach(el => el.classList.toggle('is-active', Number(el.dataset.scene) === year));
    document.querySelectorAll('[data-year]').forEach(el => el.classList.toggle('is-active', Number(el.dataset.year) === year));
    document.getElementById('cursor-tag').textContent = String(year);
    const cursor = position[year];
    document.getElementById('global-cursor').style.left = `calc(130px + (100% - 130px) * ${cursor / 100})`;
    document.getElementById('slider-progress').style.width = `${cursor}%`;
    document.querySelectorAll('.track-node').forEach(el => el.style.left = `${cursor}%`);
    const search = document.querySelector('#search');
    if (search && document.activeElement !== search)
        search.value = '';
    updateDetails();
}
function updateTheme(t) { theme = t; if(t!=='daily')focusedRadarAxis=t; document.querySelectorAll('[data-theme]').forEach(el => el.classList.toggle('is-active', el.dataset.theme === theme)); updateDetails(); }
function updateRegion(id) {
    currentRegion = id;
    const r = region(id), f = facts(year, id);
    document.querySelectorAll('.civilization').forEach(el => {
        const active = el.dataset.region === id;
        el.classList.toggle('is-selected', active);
        el.querySelectorAll('[data-region-select]').forEach(btn => btn.setAttribute('aria-pressed', String(active)));
    });
    document.getElementById('detail-avatar')?.setAttribute('src', asset('avatar-' + id + '.webp'));
    document.getElementById('detail-name').innerHTML = `${safe(id === 'europe' && year === 1776 ? '英国' : r.name)} <small>${safe(id === 'europe' && year === 1776 ? 'Britain' : r.en)}</small>`;
    document.getElementById('region-tag').textContent = r.name;
    const idx = REGIONS.findIndex(v => v.id === id);
    const description = (id === 'europe' && year === 1776) ? '1776 年的英国正处于工业革命早期，蒸汽动力、纺织机械和工厂制度开始改变生产方式，城市与海上贸易成为其经济网络的重要部分。' : `${year} 年，${r.name}：${f[theme]}。${f.daily}。世界各地正以不同节奏经历政治、知识与生产方式的变化。`;
    document.getElementById('detail-summary').textContent = description;
    document.getElementById('fact-list').innerHTML = [['发展阶段', idx === 0 ? EPOCHS[year].tag : r.middle], ['主要政体', f.governance], ['经济结构', f.industry], ['知识技术', f.technology], ['文化生活', f.culture], ['本期焦点', f[theme]]].map(([k, v], i) => `<div class="fact-row"><span class="feature-icon">${['⌬', '♧', '▱', '◈', '✧', '○'][i]}</span><span class="fact-key">${safe(k)}</span><strong>${safe(v)}</strong></div>`).join('');
    document.getElementById('detail-art')?.setAttribute('src', id === 'europe' ? asset('britain.webp') : asset('rail-' + id + '.webp'));
    const lives = { 普通工人: `在 ${year} 年的${r.name}，普通劳动者的生活取决于城市、乡村及具体身份。${f.daily}。`, 商人: `商业网络连接不同地区，但交通、信用和制度环境各异。${f.industry}。`, 知识分子: `教育机会受到阶层、地域和政治制度影响。${f.technology}。`, 女性: `不同阶层女性的法律地位、劳动和社会角色差异显著，不能用单一叙事概括整个地区。${f.daily}。` };
    document.getElementById('life-body').textContent = lives[life];
    document.getElementById('life-image')?.setAttribute('src', life === '普通工人' ? asset('workers.webp') : asset('rail-' + id + '.webp'));
 document.getElementById('radar').innerHTML=renderRadar();
 document.getElementById('radar-legend').innerHTML=renderRadarLegend();
 document.getElementById('score-breakdown').innerHTML=renderScoreBreakdown();
}
const dimensionsInOrder = ['industry', 'technology', 'governance', 'culture', 'daily'];
function showOverview() {
    currentRegion = null;
    document.getElementById('details').hidden = true;
    document.getElementById('overview').hidden = false;
    document.querySelectorAll('.civilization').forEach(el => {
        el.classList.remove('is-selected');
        el.querySelectorAll('[data-region-select]').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
    });
    document.getElementById('overview-year').textContent = String(year);
    document.getElementById('overview-focus').textContent = `当前对照维度 · ${themes[theme]}`;
    document.getElementById('scoring-board').innerHTML=renderOverviewScoreboard();
 document.getElementById('overview-grid').innerHTML = REGIONS.map(r => {
        const f = facts(year, r.id);
        const focus = f[theme];
        const other = dimensionsInOrder.filter(key => key !== theme);
        const displayName = r.id === 'europe' && year === 1776 ? '欧洲 · 英国' : r.name;
        return `<button type="button" class="overview-card" data-region-select="${r.id}" aria-label="查看 ${year} 年${safe(displayName)}详情" style="--card-color:${r.color}">
   <span class="overview-card-art" style="background-image:url('${asset('rail-' + r.id + '.webp')}')"></span>
   <span class="overview-card-heading"><img src="${asset('avatar-' + r.id + '.webp')}" alt=""/><span class="overview-card-identity"><strong>${safe(displayName)}</strong><small>${safe(r.en)}</small></span><span class="overview-open">↗</span></span>
   <span class="overview-card-focus"><small>${safe(themes[theme])} · ${year} 年</small><strong>${safe(focus)}</strong></span>
   <span class="overview-card-facts">${other.map(k => `<span><b>${safe(themes[k])}</b><em>${safe(f[k])}</em></span>`).join('')}</span>
   <span class="overview-card-cta">点击聚焦这段历史 <span aria-hidden="true">→</span></span>
  </button>`;
    }).join('');
}
function updateDetails() {
    if (currentRegion === null) {
        showOverview();
        return;
    }
    document.getElementById('overview').hidden = true;
    document.getElementById('details').hidden = false;
    updateRegion(currentRegion);
}
function toggleRegion(id) {
    if (currentRegion === id) {
        showOverview();
        return;
    }
    currentRegion = id;
    updateDetails();
}
function showDialog(title, body) { document.getElementById('dialog-title').textContent = title; document.getElementById('dialog-body').textContent = body; const d = document.getElementById('dialog'); d.classList.add('is-open'); d.setAttribute('aria-hidden', 'false'); }
function closeDialog() { const d = document.getElementById('dialog'); d.classList.remove('is-open'); d.setAttribute('aria-hidden', 'true'); }
root.addEventListener('click', event => {
    const t = event.target, btn = t.closest('button');
    if (!btn)
        return;
    if (btn.dataset.year) {
        updateYear(Number(btn.dataset.year));
        return;
    }
    if (btn.dataset.scoreAxis) { focusedRadarAxis=btn.dataset.scoreAxis; updateDetails(); return; }
    if (btn.dataset.theme) {
        updateTheme(btn.dataset.theme);
        return;
    }
    if (btn.dataset.regionSelect) {
        toggleRegion(btn.dataset.regionSelect);
        return;
    }
    if (btn.id === 'clear-region') {
        showOverview();
        return;
    }
    if (btn.dataset.life) {
        life = btn.dataset.life;
        document.querySelectorAll('[data-life]').forEach(x => x.classList.toggle('is-active', x.dataset.life === life));
        if (currentRegion)
            updateRegion(currentRegion);
        return;
    }
    if (btn.id === 'prev-year') {
        updateYear(prevNext(-1));
        return;
    }
    if (btn.id === 'next-year') {
        updateYear(prevNext(1));
        return;
    }
    if (btn.id === 'watch-story') {
        showDialog('每一年，都有不同的世界', `选中的时代是 ${year} 年。${EPOCHS[year].description} 这是一款可交互历史研究原型，尚未制作真正的视频。`);
        return;
    }
    if ((btn.id === 'open-history' || btn.id === 'life-more') && currentRegion) {
        const r = region(currentRegion);
        const f = facts(year, currentRegion);
        showDialog(`${year} 年 · ${r.name}`, `${f.industry}；${f.technology}；${f.governance}；${f.culture}；${f.daily}`);
        return;
    }
    if (btn.id === 'close-dialog') {
        closeDialog();
        return;
    }
    if (btn.dataset.nav) {
        currentView = btn.dataset.nav;
        document.querySelectorAll('[data-nav]').forEach(x => x.classList.toggle('is-active', x.dataset.nav === currentView));
        if (currentView === 'timeline') {
            document.getElementById('timeline').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        else if (currentView === 'compare') {
            document.getElementById(currentRegion === null ? 'overview' : 'details').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        else
            showDialog('正在建设', `${btn.textContent || '功能'}将在后续版本开放；当前重点是同年时间轴和背景联动。`);
        return;
    }
    if (btn.dataset.view) {
        document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('is-active', x.dataset.view === btn.dataset.view));
        if (btn.dataset.view === 'compare')
            document.getElementById(currentRegion === null ? 'overview' : 'details').scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (btn.dataset.view === 'map')
            showDialog('世界地图视图', '正在规划历史地理边界数据和地图时空联动，目前可以在时间轴对照各地区。');
        return;
    }
    if (btn.classList.contains('book-btn')) {
        showDialog('关于同年异世', '在同一时间坐标下，平行浏览全球文明的技术、产业、制度与人文变迁。第一批 6 个年份是样本节点，不代表连续完整史实数据库。');
        return;
    }
});
document.getElementById('dialog').addEventListener('click', e => { if (e.target === e.currentTarget)
    closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape')
    closeDialog(); if (document.activeElement?.tagName === 'INPUT')
    return; if (e.key === 'ArrowLeft')
    updateYear(prevNext(-1)); if (e.key === 'ArrowRight')
    updateYear(prevNext(1)); });
const input = document.querySelector('#search');
input.addEventListener('keydown', e => { if (e.key !== 'Enter')
    return; const nums = (input.value.match(/\d{3,4}/) || [])[0]; if (nums) {
    const q = Number(nums);
    updateYear(YEARS.reduce((a, b) => Math.abs(b - q) < Math.abs(a - q) ? b : a));
    input.blur();
}
else
    showDialog('搜索提示', '当前支持按年份搜索；文明、人物与历史事件全文检索还在建设中。'); });
let pointerStart = 0;
const slider = document.getElementById('slider-rail');
slider.addEventListener('pointerdown', e => { if (e.target.closest('.year-tick'))
    return; pointerStart = e.clientX; slider.setPointerCapture(e.pointerId); });
slider.addEventListener('pointerup', e => { if (!pointerStart)
    return; const rect = slider.getBoundingClientRect(); const x = (e.clientX - rect.left) / rect.width * 100; const nearest = YEARS.reduce((a, b) => Math.abs(position[b] - x) < Math.abs(position[a] - x) ? b : a); updateYear(nearest); pointerStart = 0; });
updateYear(year);
</script></body></html>
