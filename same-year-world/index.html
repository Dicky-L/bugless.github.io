function moveEra(dir) { const closest = sceneYear(selectedYear); const idx = YEARS.indexOf(closest); setYear(YEARS[Math.min(YEARS.length - 1, Math.max(0, idx + dir))], true); }
function setYear(y, scroll) { if (!Number.isFinite(y))
    return; selectedYear = Math.max(MIN, Math.min(MAX, Math.round(y))); render(); if (scroll) {
    const sc = document.getElementById('timeline-scroll');

        sc.scrollLeft = 0;

function titleFor(id) { const r = region(id); return r.name; }
function render() {
    const scene = sceneYear(selectedYear), epoch = EPOCHS[scene], isExact = exact(selectedYear);
    document.querySelectorAll('.scene').forEach(x => x.classList.toggle('active', x.id === `scene-${scene}`));
    document.getElementById('hero-number').textContent = String(selectedYear);
    document.getElementById('hero-title').textContent = isExact ? epoch.tag : `接近 ${scene} 年的历史画卷`;
    document.getElementById('hero-copy').textContent = isExact ? epoch.description : `当前年份 ${selectedYear}：展示最接近的 ${scene} 年代表性历史场景。此年份尚未录入经审核的文明资料，不自动推断具体史实。`;
    document.querySelectorAll('.active-year').forEach(x => x.textContent = String(selectedYear));
    document.querySelectorAll('[data-era]').forEach(x => x.classList.toggle('active', Number(x.dataset.era) === scene));
    document.querySelectorAll('[data-dim]').forEach(x => x.classList.toggle('active', x.dataset.dim === selectedDim));
    document.getElementById('scrubber').value = String(selectedYear);
    document.getElementById('year-field').value = String(selectedYear);
    const ruler = document.getElementById('ruler-ticks');
    ruler.innerHTML = YEARS.map(y => `<span class="tick" style="left:${pct(y)}%">${y}</span>`).join('');
    const lanes = document.getElementById('region-lanes');
    lanes.innerHTML = REGIONS.map((r, i) => `<div class="rail-row"><button class="rail-label" data-region="${r.id}" title="查看${r.name}在${selectedYear}年的样本资料"><span class="thumb" style="background:${r.color}">${['欧', '中', '日', '南', '中', '非', '美'][i]}</span><span><span class="n">${r.name}</span><span class="e" style="display:block">${r.en}</span></span></button><div class="rail-track" data-rail="${r.id}" style="--color:${r.color};--tint:${shade(r.color, '2c')}">${YEARS.map(y => `<span class="rail-point ${selectedYear === y ? 'selected' : ''}" data-pick="${y}" style="left:${pct(y)}%" title="${y} 年"></span>`).join('')} ${i === REGIONS.findIndex(r => r.id === selectedRegion) ? `<div class="track-label" style="left:${pct(selectedYear)}%">${esc(selectedFact(r.id))}</div>` : ''}</div></div>`).join('');

        setYear(+target.dataset.pick, false);
        selectedRegion = b.dataset.rail;
        render();
        return;
    } const x = e.clientX - b.getBoundingClientRect().left; setYear(MIN + x / b.clientWidth * (MAX - MIN), false); selectedRegion = b.dataset.rail; render(); }));
    document.getElementById('timeline-message').textContent = isExact ? `◉ ${selectedYear} 年 · ${DIMENSIONS.find(d => d.id === selectedDim)?.name} · 点击地区查看详情` : `◌ ${selectedYear} 年暂缺资料 · 当前参考邻近的 ${scene} 年示范性切片`;
    document.getElementById('detail-title').textContent = `${selectedYear} 年，世界正在发生什么？`;
    document.getElementById('feature-year').textContent = String(selectedYear);
    document.getElementById('feature-headline').textContent = isExact ? epoch.headline : '这一年的资料还在建设中';
    document.getElementById('feature-description').textContent = isExact ? epoch.description : `展示最接近的 ${scene} 年历史示例。真实的 ${selectedYear} 年同期事件需要更详细的逐条资料建设。`;
    for (const id of ['europe', 'china', 'japan'])

function positionCursor() { const timeline = document.getElementById('timeline-stage'), scrubber = document.getElementById('scrubber'); if (!timeline || !scrubber)
    return; const x = scrubber.getBoundingClientRect().left - timeline.getBoundingClientRect().left + scrubber.clientWidth * pct(selectedYear) / 100; for (const id of ['cursor-line', 'cursor-top']) {
    const el = document.getElementById(id);

function renderCard(id, isExact, sc) {

    const dim = DIMENSIONS.find(x => x.id === selectedDim);
    const card = document.getElementById('card-' + id);
    card.innerHTML = `<div class="iconbox">${id === 'europe' ? '⚙' : id === 'china' ? '◈' : '❀'}</div><h3 class="serif">${r.name} <span style="font:400 11px Georgia,serif;color:#94a3b0">${r.en}</span></h3><div class="subtitle">${esc(dim.name)} · ${sc} 年研究样本</div><ul>${(isExact ? [selectedDim, ...['industry', 'technology', 'governance', 'culture', 'daily'].filter(d => d !== selectedDim).slice(0, 2)] : [selectedDim]).map(d => `<li><span style="--color:${r.color}"><i class="bullet"></i><b>${esc(DIMENSIONS.find(a => a.id === d).name)}</b></span><span>${esc(statement[d])}</span></li>`).join('')}</ul><button data-open="${id}">查看更多文明背景　↗</button>`;

function openRegion(id) {

    render();
    const r = region(id), scene = sceneYear(selectedYear), isExact = exact(selectedYear), history = facts(scene, id);
    const summary = Object.entries(history).map(([key, v]) => `${DIMENSIONS.find(x => x.id === key)?.name}：${v}`).join('。\n');
    openModal(`${selectedYear} · ${r.en}`, `${r.name} · ${selectedYear} 年`, isExact ? summary + `。\n\n这是用于产品交互验证的历史概要，尚未绑定逐条的一手资料。` : `${selectedYear} 年还没有建立具体资料切片；以下是邻近 ${scene} 年的概念性对照，并非 ${selectedYear} 年的历史事实。\n\n${summary}`);
}
function openModal(kicker, title, desc) { document.getElementById('modal-kicker').textContent = kicker; document.getElementById('modal-title').textContent = title; const p = document.getElementById('modal-description'); p.textContent = desc; p.style.whiteSpace = 'pre-line'; document.getElementById('overlay').classList.add('open'); document.getElementById('close-modal').focus(); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
let toastT = 0;
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = window.setTimeout(() => t.classList.remove('show'), 2300); }
initial();
</script></body></html>
