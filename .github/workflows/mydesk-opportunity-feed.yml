name: MYDESK opportunity feed index
on:
  push:
    branches: [main]
    paths:
      - 'mydesk-data/opportunities/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mydesk-intel-feed
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public briefs and build index
        run: python mydesk-data/build_opportunity_feed.py
      - name: Publish changed feed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mydesk-data/opportunity-feed.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'MYDESK: refresh opportunity feed'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep "$attempt"
          done
          exit 1
