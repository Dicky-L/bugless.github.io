name: Build and publish AETHER Brand Site (Vue 3)
on:
  push:
    branches: [main]
    paths:
      - 'aether-brand-site-src/**'
      - '.github/workflows/build-aether.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-brand-site-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies, typecheck and build
        working-directory: aether-brand-site-src
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish only AETHER demo folder
        run: |
          mkdir -p aether-brand-site
          rsync -a --delete aether-brand-site-src/dist/ aether-brand-site/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aether-brand-site
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: publish AETHER static demo [skip ci]'
            git push
          fi
